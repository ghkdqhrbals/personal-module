services:
  guestbook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ${GUESTBOOK_DATA_DIR:-./data}:/data
    environment:
      - DATABASE_URL=sqlite:////data/guestbook.db
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - PUBLIC_MCP_SERVER_URL=${PUBLIC_MCP_SERVER_URL:-https://lowfidev.cloud/mcp/}
      - BLOG_CONTENT_DIR=${BLOG_CONTENT_DIR:-/blog-content}
      - BLOG_DOCS_DIR=${BLOG_DOCS_DIR:-/blog-content/docs}
      - BLOG_CV_PATH=${BLOG_CV_PATH:-/blog-content/cv.md}
      - BLOG_SITE_BASE_URL=${BLOG_SITE_BASE_URL:-https://ghkdqhrbals.github.io/portfolios}
