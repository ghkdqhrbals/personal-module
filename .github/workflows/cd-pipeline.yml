name: CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "etc/guestbook/**"
      - "docs/**"
      - "cv.md"
      - ".github/workflows/cd-pipeline.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL != '' && vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE != '' && vars.OPENAI_API_BASE || 'https://api.openai.com/v1' }}
      GUESTBOOK_DATA_DIR: ${{ vars.GUESTBOOK_DATA_DIR != '' && vars.GUESTBOOK_DATA_DIR || './data' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: server deploy monitoring start
        uses: ghkdqhrbals/build-monitoring@v1.0.3
        with:
          action: start
          project_name: guestbook

      - name: Make runner.sh executable
        run: chmod +x etc/runner.sh

      - name: Validate deploy env
        shell: bash
        run: |
          set -eo pipefail
          test -n "$OPENAI_API_KEY"

      - name: Prepare guestbook data directory
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$GUESTBOOK_DATA_DIR"
#      - name: Setup Docker Buildx
#        run: |
#          docker buildx use default
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Run Docker Compose
        run: |
          ./etc/runner.sh etc/guestbook/docker-compose.yaml

      - name: Verify local endpoints
        shell: bash
        run: |
          set -eo pipefail
          curl -fsS http://127.0.0.1:8000/health
          python - <<'PY'
          import sys
          import urllib.error
          import urllib.request

          urls = [
              "http://127.0.0.1:8000/mcp",
              "http://127.0.0.1:8000/mcp/",
          ]

          for url in urls:
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      print(f"{url} -> {response.status}")
                      sys.exit(0)
              except urllib.error.HTTPError as exc:
                  if exc.code < 500:
                      print(f"{url} -> HTTP {exc.code}")
                      sys.exit(0)
              except Exception as exc:
                  print(f"{url} -> {exc}")

          raise SystemExit("MCP endpoint did not respond successfully")
          PY

      - name: server deploy monitoring end
        uses: ghkdqhrbals/build-monitoring@v1.0.3
        id: deploy-stats
        with:
          action: end
          project_name: guestbook
          job_status: ${{ job.status }}
          health_check_url: https://lowfidev.cloud/health
          health_wait_seconds: 60

      - name: Send Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
            status: ${{ job.status }}
            fields: repo,commit,author,workflow,job,took
            custom_payload: |
                {
                    "attachments": [
                        {
                        "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                        "blocks": [
                            {
                            "type": "section",
                            "text": {
                                "type": "mrkdwn",
                                "text": "*Deployment Notification* :rocket:\n*Project:* guestbook\n*Status:* ${{ job.status }}\n*Duration:* ${{ steps.deploy-stats.outputs.build_time_ms }} seconds\n*Health Check:* <${{ steps.deploy-stats.outputs.health_check_url }}|Link>"
                            }
                            }
                        ]
                        }
                    ]
                    }
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
